<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En construction · Dev Affranchi</title>
<meta name="description" content="Le site Dev Affranchi est en construction. Les pages services reviennent bientôt.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0f12">
<link rel="icon" type="image/png" href="assets/logo-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0f12;
  --line:#262b33;
  --text:#e8e6e1;
  --muted:#9aa1ad;
  --accent:#f0a13c;
  --pad:clamp(20px,5vw,48px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--ink);
  color:var(--text);
  font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;
  font-size:clamp(16px,1.05vw,17px);
  line-height:1.6;
  text-wrap:pretty;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:72px 72px;opacity:.22;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 85%);
  mask-image:linear-gradient(to bottom,#000 0%,transparent 85%);
}
.wrap{width:100%;max-width:860px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);position:relative;z-index:1}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}

header{border-bottom:1px solid var(--line);position:relative;z-index:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;text-decoration:none;color:inherit}
.brand-logo{height:26px;width:auto;display:block}
.bar .mono{color:var(--muted)}

main{flex:1;display:flex;align-items:center;padding-top:clamp(48px,10vh,96px);padding-bottom:clamp(48px,10vh,96px)}
.kicker{color:var(--accent);margin:0 0 18px}
h1{
  font-size:clamp(2.8rem,9vw,5.2rem);
  line-height:.98;
  letter-spacing:-.04em;
  font-weight:700;
  margin:0 0 24px;
  max-width:15ch;
}
.lede{color:var(--muted);font-size:clamp(1.05rem,1.6vw,1.2rem);max-width:48ch;margin:0}
.lede a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--accent)}
.lede a:hover{color:var(--accent)}
.lede a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

footer{border-top:1px solid var(--line);position:relative;z-index:1}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding-top:22px;padding-bottom:22px;color:var(--muted);font-size:.92rem}
footer a{text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--text);border-color:var(--accent)}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="/">
      <img class="brand-logo" src="assets/logo.png" alt="">
      Dev Affranchi
    </a>
    <div class="mono">Travaux en cours</div>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="mono kicker">Site en travaux</p>
    <h1>En construction.</h1>
    <p class="lede">Le site revient bientôt. Les pages services sont en cours de mise à jour. Pour me joindre avant, écris à <a href="mailto:devaffranchi@gmail.com">devaffranchi@gmail.com</a>.</p>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <div>Dev Affranchi</div>
    <div><a href="https://www.youtube.com/@devaffranchi">YouTube</a> · <a href="mailto:devaffranchi@gmail.com">Email</a></div>
  </div>
</footer>

</body>
</html>
